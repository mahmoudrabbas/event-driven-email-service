version: '3.9'

services:
    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq

        ports:
            - '5672:5672'
            - '15672:15672'

        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest

    api:
        build:
            context: ./api

        container_name: api

        ports:
            - '8080:8080'

        depends_on:
            - rabbitmq

    email-service:
        build:
            context: ./email-service

        container_name: email-service

        env_file:
            - ./email-service/.env

        depends_on:
            - rabbitmq
